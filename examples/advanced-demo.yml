name: CI/CD Pipeline with Feishu Notifications

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run tests
        id: test
        run: |
          echo "Running tests..."
          npm test
          echo "test_result=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Notify test result (custom bot)
        uses: feishu-bot-action@1.0.0
        with:
          bot-type: custom
          webhook-url: ${{ webhook_url }}
          message: |
            📋 测试报告
            分支: ${{ github.ref_name }}
            提交者: ${{ github.actor }}
            测试结果: ${{ steps.test.outputs.test_result == 'success' && '✅ 通过' || '❌ 失败' }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build project
        run: |
          npm install
          npm run build

      - name: Send build notification (app bot - rich text)
        uses: feishu-bot-action@1.0.0
        with:
          bot-type: app
          app-id: ${{ app_id }}
          app-secret: ${{ app_secret }}
          receive-type: chat_id
          receive-id: ${{ chat_id }}
          msg-type: post
          message: |
            {
              "post": {
                "zh_cn": {
                  "title": "🔨 构建完成",
                  "content": [
                    [{"tag": "text", "text": "项目: "}, {"tag": "text", "text": "${{ github.repository }}"}],
                    [{"tag": "text", "text": "分支: "}, {"tag": "text", "text": "${{ github.ref_name }}"}],
                    [{"tag": "text", "text": "提交: "}, {"tag": "text", "text": "${{ github.sha }}"}],
                    [{"tag": "text", "text": "触发者: "}, {"tag": "text", "text": "${{ github.actor }}"}]
                  ]
                }
              }
            }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production..."

      - name: Send deployment success notification (custom bot)
        uses: feishu-bot-action@1.0.0
        with:
          bot-type: custom
          webhook-url: ${{ webhook_url }}
          message: |
            🎉 部署成功！
            项目: ${{ github.repository }}
            环境: 生产环境
            版本: ${{ github.sha }}
            部署者: ${{ github.actor }}

      - name: Send private notification (app bot)
        uses: feishu-bot-action@1.0.0
        with:
          bot-type: app
          app-id: ${{ app_id }}
          app-secret: ${{ app_secret }}
          receive-type: open_id
          receive-id: ${{ user_open_id }}
          message: "您的部署任务已完成！"