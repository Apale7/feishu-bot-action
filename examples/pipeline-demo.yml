name: Build and Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build project
        run: |
          echo "Building project..."
          npm install
          npm run build

      - name: Send success notification (custom bot)
        uses: feishu-bot-action@1.0.0
        with:
          bot-type: custom
          webhook-url: ${{ webhook_url }}
          message: "✅ 构建成功！项目已构建完成，分支: main"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production..."

      - name: Send deployment notification (app bot)
        uses: feishu-bot-action@1.0.0
        with:
          bot-type: app
          app-id: ${{ app_id }}
          app-secret: ${{ app_secret }}
          receive-type: chat_id
          receive-id: ${{ chat_id }}
          message: "🚀 部署成功！项目已部署到生产环境"