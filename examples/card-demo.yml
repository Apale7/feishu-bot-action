name: Feishu Card Message Examples

on:
  push:
    branches:
      - main

jobs:
  send-pipeline-card:
    runs-on: ubuntu-latest
    steps:
      - name: Send Pipeline Card (App Bot)
        uses: feishu-bot@1.0.0
        with:
          bot-type: app
          app-id: ${{ app_id }}
          app-secret: ${{ app_secret }}
          receive-type: open_id
          receive-id: ${{ receive_id }}
          msg-type: interactive
          message: |
            {
              "config": {
                "wide_screen_mode": true
              },
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "流水线构建通知"
                },
                "template": "blue"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**项目名称：** CodeArts Demo\n**构建状态：** ✅ 成功\n**构建时间：** 2024-01-15 14:30:00\n**构建人：** 张三"
                  }
                },
                {
                  "tag": "hr"
                },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**构建详情**\n- 分支：main\n- 提交ID：a1b2c3d\n- 提交信息：feat: 新增飞书通知功能"
                  }
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "查看详情"
                      },
                      "type": "primary",
                      "url": "https://codearts.example.com/pipeline/123"
                    },
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "查看日志"
                      },
                      "type": "default",
                      "url": "https://codearts.example.com/pipeline/123/logs"
                    }
                  ]
                },
                {
                  "tag": "note",
                  "elements": [
                    {
                      "tag": "plain_text",
                      "content": "此消息由 CodeArts Pipeline 自动发送"
                    }
                  ]
                }
              ]
            }

  send-rich-text:
    runs-on: ubuntu-latest
    steps:
      - name: Send Rich Text Message (App Bot)
        uses: feishu-bot@1.0.0
        with:
          bot-type: app
          app-id: ${{ app_id }}
          app-secret: ${{ app_secret }}
          receive-type: open_id
          receive-id: ${{ receive_id }}
          msg-type: post
          message: |
            {
              "zh_cn": {
                "title": "我是一个标题",
                "content": [
                  [
                    {
                      "tag": "text",
                      "text": "第一行:",
                      "style": ["bold", "underline"]
                    },
                    {
                      "tag": "a",
                      "href": "http://www.feishu.cn",
                      "text": "超链接",
                      "style": ["bold", "italic"]
                    },
                    {
                      "tag": "at",
                      "user_id": "ou_1avnmsbv3k45jnk34j5",
                      "style": ["lineThrough"]
                    }
                  ],
                  [
                    {
                      "tag": "text",
                      "text": "第二行:",
                      "style": ["bold", "underline"]
                    },
                    {
                      "tag": "text",
                      "text": "文本测试"
                    }
                  ],
                  [{
                    "tag": "emotion",
                    "emoji_type": "SMILE"
                  }],
                  [{
                    "tag": "hr"
                  }],
                  [{
                    "tag": "code_block",
                    "language": "GO",
                    "text": "func main() int64 {\n    return 0\n}"
                  }],
                  [{
                    "tag": "md",
                    "text": "**mention user:**<at user_id=\"ou_xxxxxx\">Tom</at>\n**href:**[Open Platform](https://open.feishu.cn)\n**code block:**\n```GO\nfunc main() int64 {\n    return 0\n}\n```\n**text styles:** **bold**, *italic*, ***bold and italic***, ~underline~,~~lineThrough~~\n> quote content\n\n1. item1\n    1. item1.1\n    2. item2.2\n2. item2\n --- \n- item1\n    - item1.1\n    - item2.2\n- item2"
                  }]
                ]
              }
            }

  send-success-card:
    runs-on: ubuntu-latest
    steps:
      - name: Send Success Card (App Bot)
        uses: feishu-bot@1.0.0
        with:
          bot-type: app
          app-id: ${{ app_id }}
          app-secret: ${{ app_secret }}
          receive-type: open_id
          receive-id: ${{ receive_id }}
          msg-type: interactive
          message: |
            {
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "构建成功通知"
                },
                "template": "green"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "✅ **构建成功**\n\n项目已成功构建并部署。"
                  }
                },
                {
                  "tag": "div",
                  "fields": [
                    {
                      "is_short": true,
                      "text": {
                        "tag": "lark_md",
                        "content": "**分支**\nmain"
                      }
                    },
                    {
                      "is_short": true,
                      "text": {
                        "tag": "lark_md",
                        "content": "**耗时**\n2m 30s"
                      }
                    }
                  ]
                }
              ]
            }

  send-simple-card:
    runs-on: ubuntu-latest
    steps:
      - name: Send Simple Card (Custom Bot)
        uses: feishu-bot@1.0.0
        with:
          bot-type: custom
          webhook-url: ${{ webhook_url }}
          msg-type: interactive
          message: |
            {
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "简单通知卡片"
                },
                "template": "green"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "plain_text",
                    "content": "这是一条来自飞书机器人插件的测试消息。"
                  }
                }
              ]
            }

  pipeline-with-dynamic-card:
    runs-on: ubuntu-latest
    steps:
      - name: Build project
        id: build
        run: |
          echo "Building..."
          echo "build_status=success" >> $GITHUB_OUTPUT
      
      - name: Send Pipeline Notification (Dynamic Card)
        uses: feishu-bot@1.0.0
        with:
          bot-type: app
          app-id: ${{ app_id }}
          app-secret: ${{ app_secret }}
          receive-type: open_id
          receive-id: ${{ receive_id }}
          msg-type: interactive
          message: |
            {
              "config": {
                "wide_screen_mode": true
              },
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "流水线构建通知"
                },
                "template": "${{ steps.build.outputs.build_status == 'success' && 'green' || 'red' }}"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**项目名称：** ${{ github.repository }}\n**构建状态：** ${{ steps.build.outputs.build_status == 'success' && '✅ 成功' || '❌ 失败' }}\n**构建时间：** $(date '+%Y-%m-%d %H:%M:%S')\n**构建人：** ${{ github.actor }}"
                  }
                },
                {
                  "tag": "hr"
                },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**构建详情**\n- 分支：${{ github.ref_name }}\n- 提交ID：${{ github.sha }}\n- 提交信息：${{ github.event.head_commit.message }}"
                  }
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "查看详情"
                      },
                      "type": "primary",
                      "url": "https://codearts.example.com/pipeline/123"
                    }
                  ]
                },
                {
                  "tag": "note",
                  "elements": [
                    {
                      "tag": "plain_text",
                      "content": "此消息由 CodeArts Pipeline 自动发送"
                    }
                  ]
                }
              ]
            }